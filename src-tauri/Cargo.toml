[package]
name = "vlogcut-app"
version.workspace = true
edition.workspace = true
description = "App desktop vlogcut"

[[bin]]
name = "vlogcut"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vlogcut-core = { path = "../crates/core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
notify = "8"
dirs.workspace = true
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[features]
# Nhúng giao diện (ui/dist) vào file .exe thay vì lấy từ máy chủ dev (localhost:5173).
# `tauri build` tự bật; deploy.ps1 bật bằng `--features custom-protocol`.
custom-protocol = ["tauri/custom-protocol"]
